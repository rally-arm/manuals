<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G-Trip Compact　日除け取り付け3Dイメージ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dde2e5; --fg:#1c2226; --muted:#59646b; --btn:#f4f6f7; --btn-fg:#1c2226; --line:#b9c2c7; --on:#c8261d; --on-fg:#ffffff;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b2023; --fg:#e8ecee; --muted:#9aa6ad; --btn:#2a3136; --btn-fg:#e8ecee; --line:#3c464c; --on:#e0392e; --on-fg:#ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b2023; --fg:#e8ecee; --muted:#9aa6ad; --btn:#2a3136; --btn-fg:#e8ecee; --line:#3c464c; --on:#e0392e; --on-fg:#ffffff;
  color-scheme: dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
header{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:18px 22px;pointer-events:none}
h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:.02em}
header p{margin:.35rem 0 0;font-size:.8rem;color:var(--muted);max-width:36rem;line-height:1.6}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 24px)}
button{font:inherit;font-size:.85rem;padding:.6rem 1rem;border-radius:999px;border:1px solid var(--line);
  background:var(--btn);color:var(--btn-fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--on-fg)}
button:focus-visible{outline:3px solid var(--on);outline-offset:2px}
.hint{position:fixed;right:22px;max-width:16rem;text-align:right;line-height:1.5;top:calc(env(safe-area-inset-top,0px) + 22px);font-size:.75rem;color:var(--muted)}
@media (max-width:560px){.hint{display:none}}
.range{display:flex;align-items:center;gap:.6rem;font-size:.85rem;padding:.3rem .9rem;border-radius:999px;
  border:1px solid var(--line);background:var(--btn);color:var(--btn-fg)}
.range input{width:9rem;accent-color:var(--on)}
</style>
</head>
<body>
<div id="stage"></div>
<header>
  <h1>G-Trip Compact　日除け取り付け3Dイメージ</h1>
  <p>現在開発中のコンパクトGPSトリップメーターの日よけイメージアニメーションです。</p>
</header>
<div class="hint">日よけを上下にドラッグで開閉／ほかの場所のドラッグで回転</div>
<div class="bar">
  <button id="play">取り付けを再生</button>
  <button id="lid" aria-pressed="false">蓋をする</button>
  <label class="range">開閉<input type="range" id="open" min="0" max="1000" value="0" aria-label="日よけの開閉"></label>
  <button id="spin" aria-pressed="true">自動回転</button>
  <button id="visor" aria-pressed="true">日よけ</button>
  <button id="front">正面から見る</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

// ---- case ----
function roundRect(w, h, r){
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
const bev = 0.8;
const caseGeo = new THREE.ExtrudeGeometry(roundRect(CW - 2*bev, CH - 2*bev, CR - bev),
  {depth: CD - 2*bev, bevelEnabled:true, bevelSize:bev, bevelThickness:bev, bevelSegments:4, curveSegments:16});
caseGeo.translate(0, 0, -(CD - 2*bev) / 2);
const caseMat = new THREE.MeshStandardMaterial({color:0x151617, roughness:0.55, metalness:0.05});
const body = new THREE.Mesh(caseGeo, caseMat); body.castShadow = true; body.receiveShadow = true;
scene.add(body);

// face drawn on a canvas so the display can show the live time
const cvs = document.createElement('canvas'); cvs.width = 760; cvs.height = 380;
const cx = cvs.getContext('2d');
const faceImg = new Image();
const tex = new THREE.CanvasTexture(cvs);
let lastSec = -1;
const DIG = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];
function hseg(x1, x2, y, t){
  cx.moveTo(x1, y); cx.lineTo(x1 + t/2, y - t/2); cx.lineTo(x2 - t/2, y - t/2);
  cx.lineTo(x2, y); cx.lineTo(x2 - t/2, y + t/2); cx.lineTo(x1 + t/2, y + t/2); cx.closePath();
}
function vseg(x, y1, y2, t){
  cx.moveTo(x, y1); cx.lineTo(x + t/2, y1 + t/2); cx.lineTo(x + t/2, y2 - t/2);
  cx.lineTo(x, y2); cx.lineTo(x - t/2, y2 - t/2); cx.lineTo(x - t/2, y1 + t/2); cx.closePath();
}
function digit(x0, n){
  const w = 31, t = 5.6, g = 1.2, top = 333, bot = 389;
  const L = x0 + t/2, R = x0 + w - t/2, T = top + t/2, B = bot - t/2, M = (top + bot) / 2;
  const on = DIG[n];
  cx.beginPath();
  if (on.includes('a')) hseg(L + g, R - g, T, t);
  if (on.includes('g')) hseg(L + g, R - g, M, t);
  if (on.includes('d')) hseg(L + g, R - g, B, t);
  if (on.includes('f')) vseg(L, T + g, M - g, t);
  if (on.includes('b')) vseg(R, T + g, M - g, t);
  if (on.includes('e')) vseg(L, M + g, B - g, t);
  if (on.includes('c')) vseg(R, M + g, B - g, t);
  cx.fill();
}
function drawFace(d){
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.clearRect(0, 0, 760, 380);
  cx.drawImage(faceImg, 0, 0, 760, 380);
  cx.setTransform(2, 0, 0, 2, -744, -604);           // work in the original image's pixel coordinates
  cx.fillStyle = 'rgb(31,31,31)'; cx.fillRect(450, 329, 252, 64);
  const p = v => String(v).padStart(2, '0');
  const hh = d.getHours();
  const s = (hh < 10 ? ' ' + hh : String(hh)) + p(d.getMinutes()) + p(d.getSeconds());
  cx.save();
  cx.transform(1, 0, -0.14, 1, 0.14 * 389, 0);       // italic slant like the real display
  cx.fillStyle = 'rgb(234,12,8)';
  cx.shadowColor = 'rgba(255,40,20,0.75)'; cx.shadowBlur = 8;
  for (let i = 0; i < 6; i++) if (s[i] !== ' ') digit(431 + i * 46, +s[i]);
  [1, 3].forEach(i => { cx.beginPath(); cx.arc(431 + i * 46 + 36, 386, 3, 0, Math.PI * 2); cx.fill(); });
  cx.restore();
}
faceImg.onload = () => { lastSec = -1; };
faceImg.src = FACE;
tex.encoding = THREE.sRGBEncoding; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const face = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH),

const vMat = new THREE.MeshStandardMaterial({color:0x2a3237, roughness:0.5, metalness:0.35, side:THREE.DoubleSide});
const hw = CW/2 + GAP, yi = CH/2 + GAP, yt = yi + T, R = 2.6, Ri = R - T, yb = yi - 5;
const zb = -CD/2, zf = zb + VD;

// U-shaped top with rounded bends
const u = new THREE.Shape();
u.moveTo(-hw - T, yb); u.lineTo(-hw - T, yt - R); u.quadraticCurveTo(-hw - T, yt, -hw - T + R, yt);
u.lineTo(hw + T - R, yt); u.quadraticCurveTo(hw + T, yt, hw + T, yt - R); u.lineTo(hw + T, yb);
u.lineTo(hw, yb); u.lineTo(hw, yi - Ri); u.quadraticCurveTo(hw, yi, hw - Ri, yi);
u.lineTo(-hw + Ri, yi); u.quadraticCurveTo(-hw, yi, -hw, yi - Ri); u.lineTo(-hw, yb); u.closePath();
const uGeo = new THREE.ExtrudeGeometry(u, {depth:VD, bevelEnabled:false, curveSegments:10});
uGeo.translate(0, 0, zb);

// side tabs with slot
function tabShape(){
  const s = new THREE.Shape(), yB = yt - TAB_BACK, yF = yt - TAB_FRONT, c = 4, k = (yF - yB) / VD;
  s.moveTo(zb, yb); s.lineTo(zf, yb); s.lineTo(zf, yF + c);
  s.quadraticCurveTo(zf, yF, zf - c, yF - k * c);
  s.lineTo(zb + c, yB + k * c);
  s.quadraticCurveTo(zb, yB, zb, yB + c); s.closePath();
  const cz = zb + SLOT_Z, cy = yt - SLOT_DROP, r = SLOT_W / 2, h = SLOT_H / 2 - r;
  const hole = new THREE.Path();
  hole.absarc(cz, cy + h, r, 0, Math.PI, false);
  hole.absarc(cz, cy - h, r, Math.PI, 2 * Math.PI, false);
  hole.closePath(); s.holes.push(hole);
  return s;
}

    new THREE.MeshStandardMaterial({color:0x8d949a, metalness:0.8, roughness:0.35}));

  screw.position.set(x < 0 ? -hw - T - 0.6 : hw + T + 0.6, yt - SLOT_DROP, zb + SLOT_Z);
  screws.push(screw);
});
// hinge on the screw axis: the visor tilts forward around it
const PY = yt - SLOT_DROP, PZ = zb + SLOT_Z;
const hinge = new THREE.Group(); hinge.position.set(0, PY, PZ);
visor.position.set(0, -PY, -PZ);
hinge.add(visor); scene.add(hinge);
// screws stay fixed in the case; the visor slides along its slots around them
const screwGroup = new THREE.Group(); hinge.add(screwGroup);
screws.forEach(s => { s.position.y = 0; s.position.z = 0; screwGroup.add(s); });
const UP = SLOT_H / 2 - SLOT_W / 2;   // slot travel from the centre position
const IN = -1.2;                        // slid toward the display in the lid position

// ---- interaction ----
const btnPlay = document.getElementById('play'), btnSpin = document.getElementById('spin'),
      btnVisor = document.getElementById('visor'), btnFront = document.getElementById('front');
if (reduce) btnSpin.setAttribute('aria-pressed', 'false');
let anim = null;
const LIFT = 70;
function playMount(){
  visor.visible = true; btnVisor.setAttribute('aria-pressed', 'true');
  lid.p = 0; lid.anim = null; applyLid(); screwGroup.visible = true;
  if (reduce){ visor.position.set(0, -PY, -PZ); return; }
  anim = {t0: performance.now(), dur: 2200};
}
btnPlay.addEventListener('click', playMount);
btnSpin.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnSpin.setAttribute('aria-pressed', String(controls.autoRotate));
});
btnVisor.addEventListener('click', () => {
  visor.visible = !visor.visible;
  screwGroup.visible = visor.visible;
  btnVisor.setAttribute('aria-pressed', String(visor.visible));
});
const btnLid = document.getElementById('lid');
const slider = document.getElementById('open');
// p: 0 = sunshade, 1 = lid. Path: lift along the slots -> tilt around the screws -> slide toward the display
const Q = Math.PI / 2, P1 = 0.15, P2 = 0.85;
const lid = {p: 0, anim: null};
function applyLid(){
  const p = lid.p; let u, a;
  if (p < P1){ u = UP * p / P1; a = 0; }
  else if (p < P2){ u = UP; a = Q * (p - P1) / (P2 - P1); }
  else { u = UP + (IN - UP) * (p - P2) / (1 - P2); a = Q; }
  hinge.rotation.x = a; visor.position.y = -PY + u;
  slider.value = Math.round(p * 1000);
  const closed = p > 0.5;
  btnLid.setAttribute('aria-pressed', String(closed));
  btnLid.textContent = closed ? '日よけに戻す' : '蓋をする';
}
function ensureVisor(){
  if (anim){ anim = null; visor.position.z = -PZ; }
  visor.visible = true; screwGroup.visible = true; btnVisor.setAttribute('aria-pressed', 'true');
}
btnLid.addEventListener('click', () => {
  ensureVisor();
  const to = lid.p > 0.5 ? 0 : 1;
  if (reduce){ lid.p = to; applyLid(); return; }
  lid.anim = {t0: performance.now(), from: lid.p, to, dur: 600 + 2400 * Math.abs(to - lid.p)};
});
slider.addEventListener('input', () => { ensureVisor(); lid.anim = null; lid.p = slider.value / 1000; applyLid(); });

// drag the visor itself: down closes, up opens
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const cvsEl = renderer.domElement;
function hitVisor(e){
  if (!visor.visible) return false;
  const r = cvsEl.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.intersectObject(visor, true).length > 0;
}
let drag = null;
cvsEl.addEventListener('pointerdown', e => {
  if (!hitVisor(e)) return;
  e.stopImmediatePropagation(); e.preventDefault();
  ensureVisor(); lid.anim = null;
  drag = {id: e.pointerId, y: e.clientY, p: lid.p, spin: controls.autoRotate};
  controls.autoRotate = false; controls.enabled = false;
  cvsEl.setPointerCapture(e.pointerId); cvsEl.style.cursor = 'grabbing';
}, true);
cvsEl.addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.id){
    lid.p = Math.min(1, Math.max(0, drag.p + (e.clientY - drag.y) / 260));
    applyLid(); return;
  }
  if (e.pointerType === 'mouse') cvsEl.style.cursor = hitVisor(e) ? 'grab' : '';
});
function endDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  controls.enabled = true; controls.autoRotate = drag.spin; drag = null;
  cvsEl.style.cursor = '';
}
cvsEl.addEventListener('pointerup', endDrag);
cvsEl.addEventListener('pointercancel', endDrag);
let camAnim = null;
btnFront.addEventListener('click', () => {
  controls.autoRotate = false; btnSpin.setAttribute('aria-pressed', 'false');
  camAnim = {t0: performance.now(), from: camera.position.clone(), to: new THREE.Vector3(0, 28, 240),
             tFrom: controls.target.clone(), tTo: new THREE.Vector3(0, 0, 10)};
});
const ease = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < 600 ? 44 : 32; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

function frame(now){
  if (anim){
    const p = Math.min((now - anim.t0) / anim.dur, 1);
    // lift above, then lower onto the case; small forward-back settle
    const drop = p < 0.25 ? 1 : 1 - ease((p - 0.25) / 0.75);
    visor.position.y = -PY + LIFT * drop;
    visor.position.z = -PZ;
    if (p >= 1) anim = null;
  }
  if (lid.anim){
    const k = Math.min((now - lid.anim.t0) / lid.anim.dur, 1);
    lid.p = lid.anim.from + (lid.anim.to - lid.anim.from) * ease(k);
    applyLid();
    if (k >= 1) lid.anim = null;
  }
  if (camAnim){
    const p = Math.min((now - camAnim.t0) / 1200, 1), e = ease(p);
    camera.position.lerpVectors(camAnim.from, camAnim.to, e);
    controls.target.lerpVectors(camAnim.tFrom, camAnim.tTo, e);
    if (p >= 1) camAnim = null;
  }
  const sec = Math.floor(Date.now() / 1000);
  if (faceImg.complete && faceImg.naturalWidth && sec !== lastSec){
    lastSec = sec; drawFace(new Date()); tex.needsUpdate = true;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
playMount();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
